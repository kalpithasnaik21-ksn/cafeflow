<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register ☕ CafeFlow</title>
  <link rel="stylesheet" href="../css/style.css?v=2026">
</head>

<body class="auth-page">

  <div class="auth-wrapper">

    <!-- LEFT BRAND SIDE -->
    <div class="auth-left">
      <div class="brand">☕ CafeFlow</div>

      <h1>
        Join the<br />
        <span>Coffee Flow</span>
      </h1>

      <p class="tagline">
        Create your account and enjoy seamless ordering
        with smarter cafe management.
      </p>

      <p class="quote">
        “Life begins after coffee.”
      </p>
    </div>

    <!-- RIGHT FORM SIDE -->
    <div class="auth-right">
      <div class="auth-card">

        <h2>Create Account</h2>
        <p class="subtitle">Start your CafeFlow journey</p>

        <!-- Hidden fields to discourage unwanted autofill -->
        <input
          type="text"
          name="fake-username"
          autocomplete="username"
          tabindex="-1"
          aria-hidden="true"
          style="display:none"
        >

        <input
          type="password"
          name="fake-password"
          autocomplete="current-password"
          tabindex="-1"
          aria-hidden="true"
          style="display:none"
        >

        <!-- Registration fields -->
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Full Name"
          autocomplete="name"
          required
        />

        <input
          id="email"
          name="email"
          type="email"
          placeholder="Email Address"
          autocomplete="email"
          required
        />

        <input
          id="password"
          name="password"
          type="password"
          placeholder="Create Password"
          autocomplete="new-password"
          required
        />

        <input
          id="phone"
          name="phone"
          type="tel"
          placeholder="Phone Number"
          autocomplete="tel"
          required
        />

        <!-- Registration status message -->
        <div
          id="authMessage"
          class="auth-message"
          role="status"
          aria-live="polite"
        ></div>

        <button
          id="registerButton"
          class="btn primary"
          type="button"
          onclick="register()"
        >
          Register
        </button>

        <p class="auth-link">
          Already have an account?
          <a href="login.html">Login</a>
        </p>

      </div>
    </div>

  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
